<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>골든벨 진행자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg0: #0a1020;
    --bg1: #111c36;
    --ink: #eef2fb;
    --ink-dim: #9aa7c4;
    --card: rgba(255, 255, 255, 0.06);
    --line: rgba(255, 255, 255, 0.1);
    --blue-a: #7aa2ff;
    --blue-b: #4f7cff;
    --coral-a: #ff8a93;
    --coral-b: #f0435a;
    --mint-a: #55e0a4;
    --mint-b: #1fb97a;
    --amber-a: #ffd98a;
    --amber-b: #ffb53d;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    color: var(--ink);
    font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background:
      radial-gradient(900px 520px at 10% -10%, rgba(79, 124, 255, 0.24), transparent 62%),
      radial-gradient(800px 520px at 100% 110%, rgba(240, 67, 90, 0.15), transparent 62%),
      linear-gradient(180deg, var(--bg0), var(--bg1));
    background-attachment: fixed;
  }
  [hidden] { display: none !important; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 28px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

  #configError { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: var(--bg0); padding: 24px; text-align: center; font-weight: 600; line-height: 1.6; }

  /* 비밀번호 게이트 */
  #gate { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 24px; }
  #gate .box { width: min(400px, 100%); padding: 34px 28px 28px; display: flex; flex-direction: column; gap: 12px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: var(--blue-a); }
  #gate h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.03em; }
  .field { width: 100%; font: inherit; font-size: 18px; padding: 15px 16px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,0.05); color: var(--ink); }
  .field:focus { outline: none; border-color: var(--blue-a); background: rgba(122,162,255,0.08); }
  #gateErr { min-height: 20px; color: var(--coral-a); font-size: 14px; font-weight: 600; }

  /* 버튼 */
  .btn {
    font: inherit; font-size: 17px; font-weight: 700; border: 0; border-radius: 999px; padding: 14px 24px; color: #fff; cursor: pointer;
    background: rgba(255, 255, 255, 0.09); border: 1px solid var(--line);
    transition: transform 0.08s, filter 0.15s, opacity 0.15s;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.32; cursor: not-allowed; filter: none; transform: none; }
  .btn.primary { background: linear-gradient(135deg, var(--blue-a), var(--blue-b)); border-color: transparent; box-shadow: 0 10px 24px -8px rgba(79,124,255,0.7); }
  .btn.open    { background: linear-gradient(135deg, var(--coral-a), var(--coral-b)); border-color: transparent; box-shadow: 0 10px 24px -8px rgba(240,67,90,0.7); }
  .btn.ok      { background: linear-gradient(135deg, var(--mint-a), var(--mint-b)); border-color: transparent; color: #06281a; box-shadow: 0 10px 24px -8px rgba(31,185,122,0.6); }
  .btn.warn    { background: linear-gradient(135deg, var(--amber-a), var(--amber-b)); border-color: transparent; color: #3a2600; box-shadow: 0 10px 24px -8px rgba(255,181,61,0.55); }

  /* 레이아웃 */
  .top { max-width: 1320px; margin: 0 auto; padding: 22px 28px 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
  .brand small { font-size: 13px; font-weight: 600; color: var(--ink-dim); letter-spacing: 0.02em; }
  .brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--mint-a); box-shadow: 0 0 0 4px rgba(85,224,164,0.18); }
  #count { padding: 9px 16px; border-radius: 999px; font-size: 15px; font-weight: 600; color: var(--ink-dim); }
  .layout { max-width: 1320px; margin: 0 auto; padding: 20px 28px 32px; display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }

  /* 무대 */
  #stage {
    min-height: min(54vh, 460px); padding: 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center;
    border-radius: 36px; border: 1px solid var(--line); background: var(--card); position: relative; overflow: hidden;
    transition: background 0.25s, border-color 0.25s;
  }
  #stage::before { content: ""; position: absolute; inset: 0; background: radial-gradient(520px 260px at 50% 0%, rgba(255,255,255,0.14), transparent 70%); pointer-events: none; }
  #stage[data-state="open"] { background: linear-gradient(145deg, var(--coral-a), var(--coral-b)); border-color: transparent; box-shadow: 0 30px 60px -24px rgba(240,67,90,0.65); }
  #stage[data-state="locked"] { background: linear-gradient(145deg, var(--amber-a), var(--amber-b)); border-color: transparent; color: #2e1d00; box-shadow: 0 30px 60px -24px rgba(255,181,61,0.55); }
  #stageLabel { font-size: 20px; font-weight: 700; letter-spacing: 0.02em; opacity: 0.85; position: relative; }
  #stageMain { font-size: clamp(56px, 10vw, 140px); font-weight: 800; line-height: 1.05; letter-spacing: -0.04em; word-break: keep-all; position: relative; }
  #stageSub { font-size: 19px; opacity: 0.85; min-height: 26px; position: relative; }
  #stage[data-state="locked"] #stageMain { animation: pop 0.35s cubic-bezier(0.2, 1.3, 0.4, 1); }
  #stage[data-state="open"] #stageMain { animation: breathe 1.8s ease-in-out infinite; }
  @keyframes pop { from { transform: scale(0.85); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  @media (prefers-reduced-motion: reduce) { #stage #stageMain { animation: none !important; } }

  #controls { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  #ptsBox { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--ink-dim); font-size: 15px; font-weight: 600; }
  #pts { width: 66px; font: inherit; font-size: 18px; font-weight: 700; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,0.05); color: var(--ink); text-align: center; }
  #pts:focus { outline: none; border-color: var(--blue-a); }
  #keys { margin: 14px 4px 0; color: var(--ink-dim); font-size: 13px; }

  /* 사이드 */
  .side { padding: 22px 20px 18px; max-height: calc(100vh - 110px); overflow: auto; }
  @media (max-width: 960px) { .side { max-height: none; } }
  .side h2 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
  .sideHead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  #qrCard { flex: none; width: 112px; padding: 6px; background: #fff; border: 0; border-radius: 16px; cursor: zoom-in; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  #qrCard img { width: 100%; height: auto; display: block; image-rendering: pixelated; }
  #qrCard span { color: #1b2a4a; font-size: 11px; font-weight: 700; }
  #board { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
  #board li { display: grid; grid-template-columns: 28px 1fr auto auto; gap: 10px; align-items: center; padding: 8px 10px 8px 12px; border-radius: 14px; background: rgba(255,255,255,0.045); }
  #board .rk { color: var(--ink-dim); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
  #board li:nth-child(1) .rk { color: var(--amber-b); }
  #board .nm { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; min-width: 0; }
  #board .nm .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4a577a; flex: none; }
  .dot.on { background: var(--mint-a); box-shadow: 0 0 0 3px rgba(85,224,164,0.18); }
  #board .sc { font-size: 22px; font-weight: 800; min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
  .mini { display: flex; gap: 4px; }
  .mini button { width: 28px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: rgba(255,255,255,0.06); color: var(--ink); font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; line-height: 1; }
  .mini button:hover { background: rgba(255,255,255,0.14); }
  #danger { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  #danger button { font: inherit; font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink-dim); cursor: pointer; }
  #danger button:hover { color: var(--ink); border-color: rgba(255,255,255,0.25); }

  /* QR 전체 화면 */
  #qrOverlay { position: fixed; inset: 0; z-index: 25; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; cursor: zoom-out; background: rgba(6, 10, 22, 0.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  #qrOverlay .plate { background: #fff; padding: 22px; border-radius: 32px; box-shadow: 0 40px 80px -20px rgba(0,0,0,0.6); }
  #qrOverlay img { display: block; width: min(68vh, 80vw); height: auto; image-rendering: pixelated; }
  #qrOverlay p { margin: 0; font-size: 20px; font-weight: 600; color: var(--ink); }
  #qrOverlay p small { display: block; margin-top: 6px; font-size: 14px; color: var(--ink-dim); font-weight: 500; text-align: center; }
</style>
</head>
<body>

<div id="configError" hidden>config.js에 Firebase 설정값과 HOST_PASSWORD가 있어야 해요.</div>

<div id="gate" hidden>
  <div class="box card">
    <div class="eyebrow">QUIZ SHOW</div>
    <h1>진행자 확인</h1>
    <input id="gatePw" class="field" type="password" placeholder="진행자 비밀번호" autocomplete="off">
    <div id="gateErr" role="alert"></div>
    <button id="gateBtn" class="btn primary">입장</button>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="brand"><i></i>Quiz Show <small>진행자</small></div>
    <div id="count" class="card"></div>
  </header>

  <div class="layout">
    <section>
      <div id="stage" data-state="closed">
        <div id="stageLabel">버저 닫힘</div>
        <div id="stageMain">대기 중</div>
        <div id="stageSub"></div>
      </div>

      <div id="controls">
        <button id="btnOpen" class="btn open">버저 열기</button>
        <button id="btnCorrect" class="btn ok" disabled>정답</button>
        <button id="btnWrong" class="btn warn" disabled>오답, 다시 열기</button>
        <button id="btnClose" class="btn">닫기</button>
        <label id="ptsBox">정답 점수 <input id="pts" type="number" min="1" value="1"></label>
      </div>
      <p id="keys">단축키: 스페이스 버저 열기, Y 정답, N 오답, Esc 닫기, Q QR 보기</p>
    </section>

    <aside class="side card">
      <div class="sideHead">
        <div>
          <h2>점수판</h2>
        </div>
        <button id="qrCard" title="클릭하면 크게 보기"><img src="qr.png" alt="참가 QR 코드"><span>클릭하면 크게</span></button>
      </div>
      <ol id="board"></ol>
      <div id="danger">
        <button id="btnResetScores">점수 전체 0점으로</button>
        <button id="btnKickAll">참가자 전부 내보내기</button>
      </div>
    </aside>
  </div>
</div>

<div id="qrOverlay" hidden>
  <div class="plate"><img src="qr.png" alt="참가 QR 코드"></div>
  <p>QR을 스캔해서 입장하세요<small>아무 곳이나 누르면 닫혀요</small></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);

  const cfgOk = typeof FIREBASE_CONFIG !== "undefined" && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf("여기에") !== 0;
  const pwOk = typeof HOST_PASSWORD === "string" && HOST_PASSWORD.length > 0;
  if (!cfgOk || !pwOk) { $("configError").hidden = false; return; }

  // 비밀번호 게이트 (같은 탭에서는 한 번만 입력)
  function unlock() {
    $("gate").hidden = true;
    $("app").hidden = false;
    startHost();
  }
  if (sessionStorage.getItem("qb_host_pw") === HOST_PASSWORD) {
    unlock();
  } else {
    $("gate").hidden = false;
    $("gatePw").focus();
    const tryPw = () => {
      if ($("gatePw").value === HOST_PASSWORD) {
        sessionStorage.setItem("qb_host_pw", HOST_PASSWORD);
        unlock();
      } else {
        $("gateErr").textContent = "비밀번호가 맞지 않아요";
        $("gatePw").value = "";
      }
    };
    $("gateBtn").onclick = tryPw;
    $("gatePw").addEventListener("keydown", (e) => { if (e.key === "Enter") tryPw(); });
  }

  function startHost() {
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();

    let round = null;
    let players = {};
    let prevState = null;
    let ac = null;

    function beep() {
      try {
        ac = ac || new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = "sine"; o.frequency.value = 880;
        o.connect(g); g.connect(ac.destination);
        g.gain.setValueAtTime(0.25, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.5);
        o.start(); o.stop(ac.currentTime + 0.5);
      } catch (e) {}
    }
    function unlockAudio() {
      try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch (e) {}
    }

    db.ref("round").on("value", (s) => {
      if (!s.exists()) { db.ref("round").set({ state: "closed", seq: 0 }); return; }
      round = s.val();
      if (round.state === "locked" && prevState !== "locked") beep();
      prevState = round.state;
      renderStage();
    });
    db.ref("players").on("value", (s) => { players = s.val() || {}; renderBoard(); renderStage(); });

    function renderStage() {
      const r = round || { state: "closed" };
      $("stage").dataset.state = r.state;
      const total = Object.keys(players).length;
      if (r.state === "open") {
        const ex = r.excluded ? Object.keys(r.excluded).length : 0;
        $("stageLabel").textContent = "버저 열림";
        $("stageMain").textContent = "누르세요!";
        $("stageSub").textContent = ex ? "기회를 쓴 사람 " + ex + "명 제외" : "";
      } else if (r.state === "locked" && r.winner) {
        $("stageLabel").textContent = "가장 먼저 누른 사람";
        $("stageMain").textContent = r.winner.name;
        $("stageSub").textContent = "";
      } else {
        $("stageLabel").textContent = "버저 닫힘";
        $("stageMain").textContent = "대기 중";
        $("stageSub").textContent = "";
      }
      const locked = r.state === "locked";
      $("btnCorrect").disabled = !locked;
      $("btnWrong").disabled = !locked;
      $("btnOpen").disabled = r.state === "open";
      $("btnClose").disabled = r.state === "closed";
      const online = Object.values(players).filter((p) => p.online).length;
      $("count").textContent = "참가 " + total + "명 · 접속 " + online + "명";
    }

    function renderBoard() {
      const arr = Object.entries(players)
        .map(([id, p]) => ({ id, name: p.name || "?", score: p.score || 0, online: !!p.online }))
        .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name, "ko"));
      $("board").replaceChildren(...arr.map((p, i) => {
        const li = document.createElement("li");
        const rk = document.createElement("div"); rk.className = "rk"; rk.textContent = i + 1;
        const nm = document.createElement("div"); nm.className = "nm";
        const dot = document.createElement("i"); dot.className = "dot" + (p.online ? " on" : "");
        const t = document.createElement("span"); t.className = "t"; t.textContent = p.name;
        nm.append(dot, t);
        const sc = document.createElement("div"); sc.className = "sc"; sc.textContent = p.score;
        const mini = document.createElement("div"); mini.className = "mini";
        const minus = document.createElement("button"); minus.textContent = "-"; minus.title = "1점 빼기";
        const plus = document.createElement("button"); plus.textContent = "+"; plus.title = "1점 더하기";
        const del = document.createElement("button"); del.textContent = "x"; del.title = "내보내기";
        minus.onclick = () => adjust(p.id, -1);
        plus.onclick = () => adjust(p.id, 1);
        del.onclick = () => { if (confirm(p.name + " 님을 내보낼까요?")) db.ref("players/" + p.id).remove(); };
        mini.append(minus, plus, del);
        li.append(rk, nm, sc, mini);
        return li;
      }));
    }

    function adjust(id, delta) {
      db.ref("players/" + id + "/score").transaction((s) => (s || 0) + delta);
    }
    function pts() { return Math.max(1, parseInt($("pts").value, 10) || 1); }
    function seq() { return (round && round.seq) || 0; }

    function openBuzzer() {
      unlockAudio();
      if (round && round.state === "open") return;
      db.ref("round").set({ state: "open", seq: seq() + 1 });
    }
    function correct() {
      if (!round || round.state !== "locked" || !round.winner) return;
      const w = round.winner;
      db.ref("players/" + w.id + "/score").transaction((s) => (s || 0) + pts());
      db.ref("round").set({ state: "closed", seq: seq() });
    }
    function wrong() {
      db.ref("round").transaction((cur) => {
        if (cur && cur.state === "locked" && cur.winner) {
          const ex = cur.excluded || {};
          ex[cur.winner.id] = true;
          return { state: "open", excluded: ex, seq: cur.seq || 0 };
        }
        return;
      });
    }
    function closeBuzzer() { db.ref("round").set({ state: "closed", seq: seq() }); }

    $("btnOpen").onclick = openBuzzer;
    $("btnCorrect").onclick = correct;
    $("btnWrong").onclick = wrong;
    $("btnClose").onclick = closeBuzzer;
    $("btnResetScores").onclick = () => {
      if (!confirm("모든 참가자의 점수를 0점으로 되돌릴까요?")) return;
      const upd = {};
      Object.keys(players).forEach((id) => { upd["players/" + id + "/score"] = 0; });
      db.ref().update(upd);
    };
    $("btnKickAll").onclick = () => {
      if (!confirm("참가자 전원을 내보낼까요? 점수도 함께 사라져요.")) return;
      db.ref("players").remove();
    };

    function toggleQr(show) { $("qrOverlay").hidden = !show; }
    $("qrCard").onclick = () => toggleQr(true);
    $("qrOverlay").onclick = () => toggleQr(false);

    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT") return;
      if (e.key === "Escape" && !$("qrOverlay").hidden) { toggleQr(false); return; }
      if (e.key === "q" || e.key === "Q") { toggleQr($("qrOverlay").hidden); return; }
      if (e.code === "Space") { e.preventDefault(); openBuzzer(); }
      else if (e.key === "y" || e.key === "Y") correct();
      else if (e.key === "n" || e.key === "N") wrong();
      else if (e.key === "Escape") closeBuzzer();
    });
  }
})();
</script>
</body>
</html>
